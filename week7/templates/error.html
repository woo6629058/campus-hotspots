{% extends "base.html" %}
{% block title %}요청을 처리하지 못했습니다 · {{ board_title }}{% endblock %}
{% block content %}
<section class="panel error-panel">
  <p class="eyebrow">REQUEST CHECK</p>
  <span class="error-symbol" aria-hidden="true">!</span>
  <h1>요청을 처리하지 못했습니다</h1>
  <p role="alert">{{ message }}</p>
  <a class="button-link" href="{{ url_for('comments') }}">여행 추천으로 돌아가기</a>
</section>
{% endblock %}
